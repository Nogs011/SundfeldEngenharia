<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Sundfeld Engenharia</title>
    
    <link rel="icon" type="image/png" href="/images/Logo_mini.png">


    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <div class="login-header">

                <span class="login-label">
                    SUNDFELD ENGENHARIA
                </span>

                <h1>
                    Painel Administrativo
                </h1>

                <p>
                    Entre com suas credenciais para continuar.
                </p>

            </div>


            <form id="login-form">

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="login-button"
                >
                    Entrar
                </button>


                <p
                    id="login-message"
                    class="login-message"
                ></p>

            </form>


            <a
                href="/"
                class="login-back"
            >
                ← Voltar para o site
            </a>

        </section>

    </main>

    <script src="/js/login.js"></script>

</body>

</html>
